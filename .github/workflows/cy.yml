name: CI/CD para Spring Boot com Maven e publicação em EC2

on:
  push:
    branches: caioarnonii-patch-3

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Atualização do código
      uses: actions/checkout@v4

    
    - name: Definindo a versão da JDK 
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' 
        java-version: '17'

    - name: Build com Maven
      run: mvn -B package -DskipTests

    
    - name: Gerar artefato Github com o .jar gerado
      uses: actions/upload-artifact@v4
      with:
        name: aplicacao
        path: ./target/*.jar

    - name: Gerar artefato Github com os arquivos .sh
      uses: actions/upload-artifact@v4        
      with:
        name: scripts
        path: .github/scripts/*.sh

  deploy:
    needs: build # segundo grupo de steps
    runs-on: ubuntu-latest

    steps:
    - name: Recuperar jars
      uses: actions/download-artifact@v4  # essa action promove o download de um ou mais arquivos de uma pasta temporária do github actions
      with:
        name: aplicacao # nome do arquivo ou conjunto de arquivos que queremos recuperar
        path: ./ # diretório da VM de execução do workflow onde os arquivos recuperados ficarão
        
    - name: Recuperar scripts
      uses: actions/download-artifact@v4
      with:
        name: scripts
        path: ./

    - name: Criar arquivo .pem a partir da variável DEPLOY_KEY e fazer o chmod 400 nele
      id: geracao-arquivo-pem # o id é opcional, mas é bom para fins de log
      run: |
        echo "${{ secrets.DEPLOY_KEY }}" >> $HOME/${{ secrets.NOME_ARQUIVO_PEM }}
        chmod 400 $HOME/${{ secrets.NOME_ARQUIVO_PEM }}
        ls

    - name: Enviar o JAR p/ a EC2
      uses: appleboy/scp-action@master # esta action abstrai o uso do comando scp, permitindo o envio de arquivos via ssh
      with:
        host: ${{ secrets.DEPLOY_HOST }} # ip da ec2 pública
        username: ubuntu
        key: ${{ secrets.DEPLOY_KEY }} # conteúdo pem que permite acesso à ec2 pública
        source: "./*.jar" # enviando todos os .jar (estão lá graças ao step 'Recuperar jars')
        target: "/home/ubuntu/deploy-crud/" # diretório de destino na ec2 pública

    - name: Enviar os Scripts p/ a EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ubuntu
        key: ${{ secrets.DEPLOY_KEY }}
        source: "./*.sh"  # enviando todos os .jar (estão lá graças ao step 'Recuperar scripts')
        target: "/home/ubuntu/deploy-crud/" # diretório de destino na ec2 pública


    - name: Conectar via SSH à EC2 privada para implantar e reiniciar a API
      run: |
        ssh -o StrictHostKeyChecking=no -i $HOME/${{ secrets.NOME_ARQUIVO_PEM }} ubuntu@${{ secrets.DEPLOY_HOST }} '
        scp -o StrictHostKeyChecking=no -i ${{ secrets.NOME_ARQUIVO_PEM }} deploy-crud/${{ secrets.NOME_ARQUIVO_JAR }} ubuntu@${{ secrets.IP_PRIVADO_EC2 }}:./home/ubuntu/deploy-crud
        scp -o StrictHostKeyChecking=no -i ${{ secrets.NOME_ARQUIVO_PEM }} deploy-crud/*.sh ubuntu@${{ secrets.IP_PRIVADO_EC2 }}:/home/ubuntu/deploy-crud
        ssh -o StrictHostKeyChecking=no -i ${{ secrets.NOME_ARQUIVO_PEM }} ubuntu@${{ secrets.IP_PRIVADO_EC2 }} "sh /home/ubuntu/deploy-crud/api-restart.sh"
        '
         
