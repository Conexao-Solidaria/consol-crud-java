name: GitHub Actions Demo

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: List directory
        run: ls -a

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify and build project (Skip tests)
        run: |
          mvn clean verify -DskipTests
          mvn package -DskipTests

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: target/*.jar

  create-release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifact

      - name: Get the latest release tag number
        id: get_release
        run: |
          LATEST_RELEASE=$(curl --silent \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
            jq -r .tag_name)
          
          if [[ "$LATEST_RELEASE" == "null" ]]; then
            echo "No releases found. Starting with version 1."
            echo "TAG_NAME=1" >> $GITHUB_ENV  # Start from version 1 if no releases exist
          else
            VERSION_NUMBER=$(echo "$LATEST_RELEASE" | sed 's/[^0-9]*//g')
            NEXT_VERSION=$((VERSION_NUMBER + 1))
            echo "Next release version: $NEXT_VERSION"
            echo "TAG_NAME=$NEXT_VERSION" >> $GITHUB_ENV  # Increment the version
          fi

      - name: Create a new release
        uses: actions/create-release@v1
        with:
          tag_name: "v${{ env.TAG_NAME }}" 
          release_name: "Release ${{ env.TAG_NAME }}"
          body: "Automated release with the latest JAR build."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR as release asset
        uses: ncipollo/release-action@v1
        with:
          tag: "v${{ env.TAG_NAME }}"
          files: build-artifact/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
