name: GitHub Actions Demo
on: [push, pull_request]

jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: List directory
        run: ls -a

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      
      - name: Run tests
        run: |
          mvn package -DskipTests

    
